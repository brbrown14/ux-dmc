name: Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tests with coverage
        id: tests
        continue-on-error: true
        run: npx vitest --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 3

      - name: Post results to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')

            const passed = '${{ steps.tests.outcome }}' === 'success'
            let summary = passed
              ? ':green_circle: **Unit Tests: PASS** (coverage \u226585%)\n'
              : ':red_circle: **Unit Tests: FAIL** (coverage < 85%)\n'

            try {
              const cov = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'))
              const t = cov.total
              summary += '\n| Category | Coverage |\n|----------|---------:|\n'
              summary += `| Lines       | ${t.lines.pct}% |\n`
              summary += `| Statements  | ${t.statements.pct}% |\n`
              summary += `| Functions   | ${t.functions.pct}% |\n`
              summary += `| Branches    | ${t.branches.pct}% |\n`
            } catch {
              summary += '\n:warning: Could not parse coverage summary'
            }

            const link = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            summary += `\n\n[View full coverage report](${link})`

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body?.includes('Unit Tests')
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: summary,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summary,
              })
            }
