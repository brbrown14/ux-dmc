name: E2E Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      - name: Pull backend Docker image
        run: docker pull ghcr.io/brbrown14/dungeon-masters-companion:latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for frontend to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:46119 >/dev/null 2>&1; then
              echo "Frontend ready"
              exit 0
            fi
            sleep 5
          done
          echo "=== Frontend logs ===" && docker compose logs frontend
          echo "=== Backend logs ===" && docker compose logs backend
          echo "=== DB logs ===" && docker compose logs postgres
          exit 1

      - name: Ensure auth directory exists
        run: mkdir -p e2e/.auth

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run E2E tests
        id: tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Post results to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            let summary = ''

            try {
              const report = JSON.parse(fs.readFileSync('results.json', 'utf8'))
              const stats = report.stats || {}

              const expected = stats.expected || 0
              const unexpected = stats.unexpected || 0
              const flaky = stats.flaky || 0
              const skipped = stats.skipped || 0
              const total = expected + unexpected + flaky + skipped
              const failedCount = unexpected + flaky

              const icon = failedCount === 0 ? ':green_circle:' : ':red_circle:'
              summary = `${icon} **E2E Test Results** — ${total} total, ${expected} passed, ${failedCount} failed${flaky > 0 ? ` (${flaky} flaky)` : ''}, ${skipped} skipped`

              if (unexpected > 0 || flaky > 0) {
                summary += '\n\n**Failed tests:**\n'
                function walkSuites(suites) {
                  for (const s of suites) {
                    if (s.specs) {
                      for (const spec of s.specs) {
                        if (!spec.ok && spec.tests) {
                          for (const test of spec.tests) {
                            if (test.status === 'unexpected' || test.status === 'flaky') {
                              const name = `${spec.title} [${test.projectName}]`
                              const err = test.results?.[0]?.errors?.[0]?.message || 'unknown error'
                              summary += `- \`${name}\`: ${err.split('\n')[0]}\n`
                            }
                          }
                        }
                      }
                    }
                    if (s.suites) walkSuites(s.suites)
                  }
                }
                walkSuites(report.suites || [])
              }

              const link = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              summary += `\n\n[View full report](${link})`
            } catch {
              summary = ':warning: Could not parse Playwright results'
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body?.includes('E2E Test Results')
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: summary,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summary,
              })
            }
