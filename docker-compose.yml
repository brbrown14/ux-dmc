services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dungeonmaster
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: pg_isready -U postgres
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/brbrown14/dungeon-masters-companion:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dungeonmaster
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      MONSTER_IMAGES_PATH: /app/monster-images
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: .
    ports:
      - "46119:80"
    depends_on:
      - backend
